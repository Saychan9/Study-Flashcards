<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>農産・衛生管理 フラッシュカード</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --bg: #f3f7f5;
    --surface: #ffffff;
    --surface-soft: #f7faf9;
    --primary: #2f7d61;
    --primary-dark: #24664e;
    --primary-soft: #e7f3ed;
    --text: #19312a;
    --muted: #6c7d76;
    --border: #dce8e2;
    --answer-bg: #edf8f1;
    --answer-border: #4d9b70;
    --shadow: 0 10px 30px rgba(31, 67, 54, .08);
  }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
                 "Yu Gothic", Meiryo, sans-serif;
    background:
      radial-gradient(circle at 10% 0%, rgba(89, 164, 126, .12), transparent 28%),
      var(--bg);
    color: var(--text);
    -webkit-text-size-adjust: 100%;
  }

  button, textarea {
    font: inherit;
  }

  .wrap {
    width: min(100% - 24px, 760px);
    margin: 0 auto;
    padding: 12px 0 10px;
    height: 100%;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  h1 {
    font-size: clamp(16px, 4.2vw, 26px);
    line-height: 1.25;
    margin: 0 0 3px;
    letter-spacing: -.02em;
    flex: none;
  }

  .wrap::before {
    content: "FLASH CARD";
    display: block;
    color: var(--primary);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .16em;
    margin-bottom: 3px;
    flex: none;
  }

  /* Menu */
  .menu {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin: 8px 0 7px;
    flex: none;
  }

  button {
    min-height: 36px;
    border: 0;
    border-radius: 10px;
    padding: 7px 6px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    -webkit-tap-highlight-color: transparent;
  }

  button:active {
    transform: scale(.98);
  }

  .primary {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 5px 14px rgba(47, 125, 97, .20);
  }

  .primary:hover {
    background: var(--primary-dark);
  }

  .secondary {
    background: var(--surface);
    color: var(--primary);
    border: 1px solid var(--border);
  }

  .secondary:hover {
    background: var(--surface-soft);
  }

  /* Progress */
  .score {
    margin: 0 0 7px;
    padding: 6px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 700;
    text-align: center;
    flex: none;
  }

  /* Quiz area fills remaining screen height */
  #quiz {
    flex: 1;
    min-height: 0;
    display: flex;
    overflow: hidden;
  }

  /* Question card */
  .card {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid rgba(220, 232, 226, .9);
    border-radius: 18px;
    padding: clamp(13px, 3.6vw, 22px);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .meta {
    display: inline-flex;
    align-items: center;
    min-height: 22px;
    padding: 3px 9px;
    margin-bottom: 7px;
    background: var(--primary-soft);
    color: var(--primary-dark);
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    flex: none;
  }

  .question {
    font-size: clamp(15px, 4vw, 21px);
    font-weight: 800;
    line-height: 1.4;
    margin-bottom: 8px;
    letter-spacing: -.015em;
    flex: none;
  }

  .hint {
    color: var(--primary-dark);
    font-size: 11.5px;
    font-weight: 700;
    margin-bottom: 8px;
    flex: none;
  }

  /* Everything below the question can scroll internally as a safety net,
     but is sized to fit on screen for normal-length answers */
  .scroll-area {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  textarea {
    display: block;
    width: 100%;
    height: 56px;
    min-height: 44px;
    padding: 9px 11px;
    border-radius: 11px;
    border: 1.5px solid var(--border);
    background: #fbfdfc;
    color: var(--text);
    font-size: 14.5px;
    line-height: 1.5;
    resize: vertical;
    outline: none;
    flex: none;
  }

  textarea::placeholder {
    color: #9aa9a3;
  }

  textarea:focus {
    border-color: #78ad98;
    box-shadow: 0 0 0 4px rgba(47, 125, 97, .10);
    background: #fff;
  }

  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 8px;
    flex: none;
  }

  .answer {
    display: none;
    margin-top: 9px;
    padding: 11px 12px;
    background: var(--answer-bg);
    border: 1px solid #cfe8d8;
    border-left: 5px solid var(--answer-border);
    border-radius: 11px;
    line-height: 1.6;
    white-space: pre-wrap;
    font-size: 13.5px;
    flex: none;
  }

  .answer.show {
    display: block;
    animation: answerIn .18s ease-out;
  }

  @keyframes answerIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .note {
    margin-top: 7px;
    color: var(--muted);
    font-size: 10.5px;
    line-height: 1.5;
    flex: none;
  }

  .done {
    text-align: center;
    justify-content: center;
    align-items: center;
    padding: 18px 14px;
  }

  .done h2 {
    margin: 0 0 8px;
    font-size: 21px;
  }

  .done p {
    margin: 0 0 16px;
    color: var(--muted);
  }

  /* Extra-short screens: trim a little further */
  @media (max-height: 620px) {
    h1 { font-size: 15px; }
    .menu { margin: 6px 0 6px; }
    button { min-height: 32px; font-size: 11px; padding: 6px; }
    textarea { height: 44px; }
  }

  /* Larger screens: a bit more breathing room */
  @media (min-width: 700px) {
    .wrap {
      padding-top: 26px;
    }

    .menu {
      grid-template-columns: auto auto 1fr;
    }

    .menu .secondary:last-child {
      justify-self: end;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🌱 農産・衛生管理 フラッシュカード</h1>

  <div class="menu">
    <button class="primary" onclick="startQuiz(10)">ランダムに10問</button>
    <button class="secondary" onclick="startQuiz(cards.length)">全部出題</button>
    <button class="secondary" onclick="resetQuiz()">最初に戻る</button>
  </div>

  <div id="score" class="score">出題方法を選んでください。</div>
  <div id="quiz"></div>
</div>

<script>
const cards = [
["カード1","アレルギーについてお客様から質問されたら、どう対応する？","即答を避け、仕様書などで確認して対応する。\n「お調べいたしますので、少々お待ちください」と伝える。"],
["カード2","まな板を洗浄するとき、最初に何をする？","流水で汚れを落とす。"],
["カード3","まな板を洗うブラシは？","まな板専用の白いブラシ。"],
["カード4","まな板はどの部分を洗う？","表・裏・側面。"],
["カード5","まな板はどのようにこする？","傷目に沿って、縦・横・斜めにこする。"],
["カード6","まな板を洗った後は？","流水ですすぎ、新しいふきんで水気をふき取る。"],
["カード7","まな板へのアルコールスプレーは、何センチ離す？","15センチ。",true],
["カード8","まな板へのアルコールスプレーは、何センチ間隔？","10センチ間隔。",true],
["カード9","まな板の殺菌には何を使う？","塩素系漂白剤250倍希釈液。"],
["カード10","塩素系漂白剤250倍希釈液は、水5リットルに漂白剤何ミリリットル？","20ミリリットル。",true],
["カード11","まな板に殺菌液をかけた後、何分置く？","15分。",true],
["カード12","15分後はどうする？","流水で十分にすすぎ、新しいふきんで水分をふき取る。"],
["カード13","包丁を洗うときに使う洗剤は？","中性洗剤。"],
["カード14","包丁はどこを洗う？","刃・柄・刃の付け根。"],
["カード15","洗浄した包丁はどこに保管する？","包丁殺菌庫。"],
["カード16","包丁殺菌庫に片付けるとき、アルコールをする？","しない。"],
["カード17","作業前、包丁のどこにアルコールをする？","刃・柄・刃の付け根。"],
["カード18","クリーンタイムのアルコール消毒箇所5つは？","①スイングドア\n②冷蔵庫・冷凍庫の取っ手\n③アルコールスプレー\n④手洗いシンクコック\n⑤洗浄シンクコック"],
["カード19","特定原材料8品目を言ってください。","そば・落花生・乳・卵・小麦・えび・かに・くるみ。"],
["カード20","体調チェック項目を言ってください。","発熱（37.5℃以上）\n下痢・腹痛\n吐き気・嘔吐\n手指の傷・荒れ\n目・耳・鼻からの分泌物がない\n黄疸"],
["カード21","実技の手洗いは何分間？","1分間。",true],
["カード22","拭取検査をする場所は？","包丁（保管分）の刃。\nアルコールスプレーボトルのヘッド部分。"],
["カード23","農産では何を確認しながら製造する？","製造仕様書を確認しながら製造する。"],
["カード24","農産のラベル貼付時に何をする？","3点一致を指さし、声出し確認をして、ラベルを貼付する。"],
["カード25","白衣の交換頻度は？","日曜日と水曜日の週2回。",true],

["カード26","まな板へのアルコールは？","15センチ離して、10センチ間隔。",true],
["カード27","まな板の殺菌倍率は？","250倍。",true],
["カード28","水5リットルに漂白剤は？","20ミリリットル。",true],
["カード29","まな板の殺菌時間は？","15分。",true],
["カード30","手洗いは何分間？","1分間。",true],
["カード31","白衣の交換は？","日曜日と水曜日、週2回。",true]
];

let quizCards = [];
let current = 0;

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

function startQuiz(count) {
  quizCards = shuffle(cards).slice(0, count);
  current = 0;
  renderQuestion();
}

function renderQuestion() {
  const q = quizCards[current];
  document.getElementById("score").textContent =
    `第 ${current + 1} 問 / ${quizCards.length} 問`;

  const numberHint = q[3] ? `<div class="hint">※数字で答えてください。</div>` : "";

  document.getElementById("quiz").innerHTML = `
    <div class="card">
      <div class="meta">${q[0]}</div>
      <div class="question">${escapeHtml(q[1])}</div>
      ${numberHint}
      <div class="scroll-area">
        <textarea id="userAnswer" placeholder="答えを自由に記入してください"></textarea>
        <div class="actions">
          <button class="primary" onclick="showAnswer()">答えを見る</button>
          <button class="secondary" onclick="nextQuestion()">次の問題 ▶</button>
        </div>
        <div id="answer" class="answer"><strong>正解：</strong>${escapeHtml(q[2])}</div>
        <div class="note">※自由記載なので、自分の答えを書いてから「答えを見る」で確認してください。</div>
      </div>
    </div>`;
}


function resetQuiz() {
  quizCards = [];
  current = 0;
  document.getElementById("score").textContent = "出題方法を選んでください。";
  document.getElementById("quiz").innerHTML = "";
}

function showAnswer() {
  document.getElementById("answer").classList.add("show");
}

function nextQuestion() {
  current++;
  if (current >= quizCards.length) {
    document.getElementById("score").textContent = "終了";
    document.getElementById("quiz").innerHTML = `
      <div class="card done">
        <h2>🎉 お疲れさまでした！</h2>
        <p>${quizCards.length}問すべて終了しました。</p>
        <button class="primary" onclick="startQuiz(${quizCards.length})">もう一度ランダム出題</button>
      </div>`;
  } else {
    renderQuestion();
  }
}

function escapeHtml(text) {
  return text.replace(/[&<>"']/g, function(m) {
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[m];
  });
}
</script>
</body>
</html>
